<title>Mesa de acomodo DTF</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --tinta:#15181e; --papel:#f2f0ea; --rollo:#ffffff; --linea:#d3cfc6;
    --acento:#1f5fd0; --acento-suave:#e6ecfb; --alerta:#b8402f; --ok:#2c7350;
    --tenue:#6d6a63; --panel:#e7e4dc; --sombra:rgba(20,22,28,.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --tinta:#ebe9e4; --papel:#171a1f; --rollo:#232830; --linea:#3a4049;
      --acento:#7ba6f2; --acento-suave:#1e2736; --alerta:#e0765f; --ok:#69ba8e;
      --tenue:#98958e; --panel:#1e222a; --sombra:rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --tinta:#ebe9e4; --papel:#171a1f; --rollo:#232830; --linea:#3a4049;
    --acento:#7ba6f2; --acento-suave:#1e2736; --alerta:#e0765f; --ok:#69ba8e;
    --tenue:#98958e; --panel:#1e222a; --sombra:rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);
       font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
  .app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
  aside{background:var(--panel);border-right:1px solid var(--linea);padding:20px;
        display:flex;flex-direction:column;gap:18px;position:sticky;top:0;
        height:100vh;overflow:auto}
  @media(max-width:860px){
    .app{grid-template-columns:1fr}
    aside{position:static;height:auto}
  }
  h1{font-size:19px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--tenue);font-size:13px;margin-top:3px}
  .metricas{display:grid;gap:10px}
  .m{background:var(--rollo);border:1px solid var(--linea);border-radius:8px;padding:10px 12px}
  .m .et{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--tenue)}
  .m .v{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;
        font-variant-numeric:tabular-nums;margin-top:2px}
  .m.destacado{border-color:var(--acento);background:var(--acento-suave)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
     color:var(--tenue);font-weight:600;padding-bottom:6px}
  td{padding:5px 0;border-top:1px solid var(--linea);font-variant-numeric:tabular-nums}
  td.n{text-align:right;font-family:"IBM Plex Mono",monospace}
  .acciones{display:flex;flex-direction:column;gap:8px}
  button{font:inherit;font-weight:500;padding:9px 12px;border-radius:7px;cursor:pointer;
         border:1px solid var(--linea);background:var(--rollo);color:var(--tinta);text-align:left}
  button:hover{border-color:var(--acento)}
  button:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
  button.primario{background:var(--acento);color:#fff;border-color:var(--acento)}
  .aviso{font-size:12px;color:var(--alerta);min-height:1.2em;font-weight:500}
  .ayuda{font-size:12px;color:var(--tenue);line-height:1.6}
  .ayuda kbd{font-family:"IBM Plex Mono",monospace;background:var(--rollo);
    border:1px solid var(--linea);border-radius:4px;padding:0 4px;font-size:11px}
  main{padding:22px 22px 60px 64px;overflow:auto}
  .mesa{position:relative;width:max-content;margin:0 auto}
  .regla{position:absolute;left:-44px;top:0;width:40px;
         font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--tenue)}
  .regla span{position:absolute;right:5px;transform:translateY(-50%)}
  .regla i{position:absolute;right:0;width:6px;border-top:1px solid var(--linea)}
  .rollo{position:relative;background:var(--rollo);border:1px solid var(--linea);
         box-shadow:0 1px 4px var(--sombra)}
  .pieza{position:absolute;cursor:grab;user-select:none;touch-action:none;
         transform-origin:center center}
  .pieza img{display:block;width:100%;height:100%;pointer-events:none}
  .pieza.sel img{filter:drop-shadow(0 0 1.5px var(--acento)) drop-shadow(0 0 1.5px var(--acento))}
  .pieza.choca img{filter:drop-shadow(0 0 2px var(--alerta)) drop-shadow(0 0 2px var(--alerta))}
  .pieza.arrastrando{cursor:grabbing;z-index:99}
  @media (prefers-reduced-motion: no-preference){
    .pieza{transition:outline-color .12s ease}
  }
</style>

<div class="app">
  <aside>
    <div>
      <h1>Mesa de acomodo</h1>
      <div class="sub">Rollo de 59,5 cm &middot; $15 el metro lineal</div>
    </div>

    <div class="metricas">
      <div class="m destacado"><div class="et">Largo usado</div><div class="v" id="mLargo">&mdash;</div></div>
      <div class="m"><div class="et">Costo del film</div><div class="v" id="mCosto">&mdash;</div></div>
      <div class="m"><div class="et">Aprovechado</div><div class="v" id="mAprov">&mdash;</div></div>
    </div>

    <div>
      <table>
        <thead><tr><th>Pedido</th><th style="text-align:right">Costo c/u</th></tr></thead>
        <tbody id="tabla"></tbody>
      </table>
      <div class="aviso" id="aviso"></div>
    </div>

    <div class="acciones">
      <button class="primario" id="bAuto">Volver al acomodo calculado</button>
      <button id="bApretar">Empujar todo hacia arriba</button>
      <button id="bGuardar">Copiar posiciones</button>
    </div>

    <div class="ayuda">
      Arrastr&aacute; las piezas sobre el rollo.<br>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0"><button onclick="girarG(-15)" style="font-size:16px;padding:10px 14px">&#8634; 15&deg;</button><button onclick="girarG(15)" style="font-size:16px;padding:10px 14px">15&deg; &#8635;</button><button onclick="girar()" style="font-size:16px;padding:10px 16px;font-weight:700">Girar 90&deg;</button></div>Toc&aacute; una pieza y arrastrala; los botones giran la seleccionada.<br>
      <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> mueven 1 mm<br>
      En rojo, las que se tocan o se salen del rollo.
    </div>
  </aside>

  <main>
    <div class="mesa" id="mesa">
      <div class="regla" id="regla"></div>
      <div class="rollo" id="rollo"></div>
    </div>
  </main>
</div>

const AIRE = 0.2;                       // cm de aire minimo entre piezas
const CANT = {"San Judas": 7, "Goku": 2, "Estandartes": 2};

const rollo = document.getElementById('rollo');
const regla = document.getElementById('regla');
let ESC = escala();
let sel = null, arr = null;

function escala(){
  const libre = Math.min(window.innerWidth - 420, 900);
  return Math.max(5, Math.min(11, libre / ROLLO));
}
const cm = v => v * ESC;

PIEZAS.forEach((p, i) => { p.id = i; p.x = 1; p.y = 1; p.rot = 0; });
if (!aplicarInicial()) acomodoSimple();

function aplicarInicial(){
  // Se empareja por archivo y medida: el algoritmo devuelve las piezas en el
  // orden en que las fue colocando, que no es el orden de esta lista.
  if (INICIAL.length !== PIEZAS.length) return false;
  const libres = INICIAL.map(o => Object.assign({}, o, { usado: false }));
  return PIEZAS.every(p => {
    const o = libres.find(q => !q.usado && q.arch === p.arch &&
                               Math.abs(q.an - p.an) < .01 && Math.abs(q.al - p.al) < .01);
    if (!o) return false;
    o.usado = true; p.x = o.x; p.y = o.y; p.rot = o.rot;
    return true;
  });
}

function acomodoSimple(){                // filas, por si no hay calculo previo
  let x = AIRE, y = AIRE, alto = 0;
  PIEZAS.slice().sort((a, b) => b.al - a.al).forEach(p => {
    if (x + p.an > ROLLO) { x = AIRE; y += alto + AIRE; alto = 0; }
    p.x = x; p.y = y; p.rot = 0;
    x += p.an + AIRE; alto = Math.max(alto, p.al);
  });
}

function dims(p){                        // medida ya rotada
  const r = p.rot * Math.PI / 180;
  const c = Math.abs(Math.cos(r)), s = Math.abs(Math.sin(r));
  return { an: p.an * c + p.al * s, al: p.an * s + p.al * c };
}
function caja(p){
  const d = dims(p);
  return { x0: p.x + (p.an - d.an) / 2, y0: p.y + (p.al - d.al) / 2,
           x1: p.x + (p.an + d.an) / 2, y1: p.y + (p.al + d.al) / 2 };
}

const RES = 20;
let malCache = new Set();
function recalc(){ malCache = choques(); }                          // px por cm para medir choques
const imgs = {}, cacheMasc = {};

function claveImg(p){ return p.arch + '|' + p.an + 'x' + p.al; }

async function cargarImagenes(){
  const vistos = {};
  await Promise.all(PIEZAS.map(async p => {
    const k = claveImg(p);
    if (vistos[k]) return;
    vistos[k] = 1;
    const im = new Image();
    im.src = p.src;
    await im.decode();
    imgs[k] = im;
  }));
}

function masc(p){
  // La mascara REAL de la pieza rotada. Sin esto, dos piezas que solo cruzan
  // sus rectangulos pero no se tocan salen marcadas como choque.
  const k = claveImg(p) + '|' + p.rot;
  if (cacheMasc[k]) return cacheMasc[k];
  const d = dims(p);
  const w = Math.max(1, Math.round(d.an * RES)), h = Math.max(1, Math.round(d.al * RES));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.translate(w / 2, h / 2);
  g.rotate(p.rot * Math.PI / 180);
  g.drawImage(imgs[claveImg(p)], -p.an * RES / 2, -p.al * RES / 2, p.an * RES, p.al * RES);
  const px = g.getImageData(0, 0, w, h).data;
  const m = new Uint8Array(w * h);
  let tinta = 0;
  const m0 = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++){ if (px[i * 4 + 3] > 40){ m0[i] = 1; tinta++; } }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){ if (!m0[y * w + x]) continue;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){ const yy = y + dy, xx = x + dx;
      if (yy >= 0 && yy < h && xx >= 0 && xx < w) m[yy * w + xx] = 1; } }
  return cacheMasc[k] = { w, h, m, tinta };
}

function fondo(p){ const c = caja(p), s = masc(p);
  for (let y = s.h - 1; y >= 0; y--) for (let x = 0; x < s.w; x++) if (s.m[y * s.w + x]) return c.y0 + (y + 1) / RES;
  return c.y1; }
function choques(){
  const mal = new Set();
  const info = PIEZAS.map(p => {
    const c = caja(p), s = masc(p);
    return { x0: Math.round(c.x0 * RES), y0: Math.round(c.y0 * RES), s, c };
  });
  for (let i = 0; i < PIEZAS.length; i++){
    if (info[i].c.x0 < -0.05 || info[i].c.x1 > ROLLO + 0.05) mal.add(i);
    for (let j = i + 1; j < PIEZAS.length; j++){
      const a = info[i], b = info[j];
      const x0 = Math.max(a.x0, b.x0), x1 = Math.min(a.x0 + a.s.w, b.x0 + b.s.w);
      const y0 = Math.max(a.y0, b.y0), y1 = Math.min(a.y0 + a.s.h, b.y0 + b.s.h);
      if (x0 >= x1 || y0 >= y1) continue;
      let toca = false;
      for (let y = y0; y < y1 && !toca; y++)
        for (let x = x0; x < x1; x++)
          if (a.s.m[(y - a.y0) * a.s.w + (x - a.x0)] &&
              b.s.m[(y - b.y0) * b.s.w + (x - b.x0)]) { toca = true; break; }
      if (toca){ mal.add(i); mal.add(j); }
    }
  }
  return mal;
}

function pintar(){
  const largo = Math.max(...PIEZAS.map(p => fondo(p)));
  rollo.style.width = cm(ROLLO) + 'px';
  rollo.style.height = cm(largo) + 'px';
  rollo.innerHTML = '';
  const mal = malCache;
  PIEZAS.forEach(p => {
    const d = document.createElement('div');
    d.className = 'pieza' + (sel === p.id ? ' sel' : '') + (mal.has(p.id) ? ' choca' : '');
    d.style.cssText = `left:${cm(p.x)}px;top:${cm(p.y)}px;width:${cm(p.an)}px;height:${cm(p.al)}px;transform:rotate(${p.rot}deg)`;
    d.dataset.id = p.id;
    const img = document.createElement('img');
    img.src = p.src; img.alt = p.arch;
    d.appendChild(img);
    rollo.appendChild(d);
  });
  regla.innerHTML = '';
  regla.style.height = cm(largo) + 'px';
  for (let c = 0; c <= largo; c += 10){
    const s = document.createElement('span');
    s.textContent = c; s.style.top = cm(c) + 'px';
    const t = document.createElement('i'); t.style.top = cm(c) + 'px';
    regla.append(s, t);
  }
  metricas(mal.size);
}

function metricas(nMal){
  const largo = Math.max(...PIEZAS.map(p => fondo(p)));
  const costo = largo / 100 * PRECIO;
  document.getElementById('mLargo').textContent = largo.toFixed(1) + ' cm';
  document.getElementById('mCosto').textContent = '$' + costo.toFixed(2);
  const tinta = PIEZAS.reduce((s, p) => s + masc(p).tinta / (RES * RES), 0);
  document.getElementById('mAprov').textContent = Math.round(tinta / (largo * ROLLO) * 100) + '%';

  const porPed = {};
  PIEZAS.forEach(p => porPed[p.ped] = (porPed[p.ped] || 0) + p.an * p.al);
  const tot = Object.values(porPed).reduce((a, b) => a + b, 0);
  document.getElementById('tabla').innerHTML = Object.entries(porPed)
    .sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `<tr><td>${k}</td><td class="n">$${(costo * v / tot / (CANT[k] || 1)).toFixed(2)}</td></tr>`)
    .join('');
  document.getElementById('aviso').textContent =
    nMal ? nMal + (nMal === 1 ? ' pieza se toca o se sale' : ' piezas se tocan o se salen') : '';
}

rollo.addEventListener('pointerdown', e => {
  const el = e.target.closest('.pieza');
  if (!el) return;
  const p = PIEZAS[+el.dataset.id];
  sel = p.id;
  const r = rollo.getBoundingClientRect();
  arr = { p, dx: (e.clientX - r.left) / ESC - p.x, dy: (e.clientY - r.top) / ESC - p.y };
  el.setPointerCapture(e.pointerId);
  el.classList.add('arrastrando');
  pintar();
});
rollo.addEventListener('pointermove', e => {
  if (!arr) return;
  const r = rollo.getBoundingClientRect();
  arr.p.x = Math.round(((e.clientX - r.left) / ESC - arr.dx) * 10) / 10;
  arr.p.y = Math.max(0, Math.round(((e.clientY - r.top) / ESC - arr.dy) * 10) / 10);
  pintar();
});
rollo.addEventListener('pointerup', () => { arr = null; recalc(); pintar(); });

addEventListener('keydown', e => {
  if (sel === null) return;
  const p = PIEZAS[sel];
  let hizo = true;
  if (e.key === 'r' || e.key === 'R') p.rot = (p.rot + (e.shiftKey ? -15 : 15) + 360) % 360;
  else if (e.key === 'ArrowLeft') p.x -= 0.1;
  else if (e.key === 'ArrowRight') p.x += 0.1;
  else if (e.key === 'ArrowUp') p.y -= 0.1;
  else if (e.key === 'ArrowDown') p.y += 0.1;
  else hizo = false;
  if (hizo){
    e.preventDefault(); recalc();
    p.x = Math.round(p.x * 10) / 10;
    p.y = Math.max(0, Math.round(p.y * 10) / 10);
    pintar();
  }
});

document.getElementById('bAuto').onclick = () => {
  if (!aplicarInicial()) acomodoSimple();
  recalc(); pintar();
};
document.getElementById('bApretar').onclick = () => {
  PIEZAS.slice().sort((a, b) => a.y - b.y).forEach(p => {
    while (p.y > 0){
      p.y = Math.round((p.y - 0.05) * 20) / 20;
      if (choques().size){ p.y = Math.round((p.y + 0.05) * 20) / 20; break; }
    }
  });
  pintar();
};
document.getElementById('bGuardar').onclick = () => {
  const txt = JSON.stringify(PIEZAS.map(p => ({ arch: p.arch, an: p.an, al: p.al,
                                                x: p.x, y: p.y, rot: p.rot })));
  navigator.clipboard.writeText(txt).then(
    () => alert('Posiciones copiadas. Pegámelas en el chat y genero el PNG a 300 dpi.'),
    () => prompt('Copiá esto y pegámelo en el chat:', txt));
};

addEventListener('resize', () => { ESC = escala(); pintar(); });

cargarImagenes().then(() => { recalc(); pintar(); });
function girar(){ if (sel === null) return; PIEZAS[sel].rot = (PIEZAS[sel].rot + 90) % 360; recalc(); pintar(); }
rollo.addEventListener('dblclick', e => { girar(); });
function girarG(g){ if (sel === null) return; PIEZAS[sel].rot = (PIEZAS[sel].rot + g + 360) % 360; recalc(); pintar(); }
</script>
